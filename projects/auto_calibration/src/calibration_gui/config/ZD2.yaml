vehicle:
  id: ZD2 #车辆编号
  car_length: 5.0 #车辆总长(m)
  car_width: 2.68 #车辆总宽(m)
  car_height: 2.15 #车辆总高(m)
  front_overhang: 0.42 #前悬长度（前轴中心到车头距离m）
  wheelbase: 4.25 #轴距(m)
  rear_overhang: 0.33 #后悬长度（后轴中心到车尾距离m）
  z_offset: 0 #后轴中心到地面的高度(m)
#每个 `lidars` / `cameras` / `radars` 条目的t = [x, y, z],R = [roll, pitch, yaw],即为该传感器在车辆坐标系中的初始安装参数

cameras:

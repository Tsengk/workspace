controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ackermann_controller:
      type: my_ackermann_bot/AckermannController

ackermann_controller:
  ros__parameters:
    use_sim_time: false
    front_left_steer_joint: front_left_steer_joint
    front_right_steer_joint: front_right_steer_joint
    rear_left_wheel_joint: rear_left_wheel_joint
    rear_right_wheel_joint: rear_right_wheel_joint
    wheelbase: 0.32
    track_width: 0.26
    wheel_radius: 0.05
    max_steer_angle: 0.6
    cmd_vel_timeout: 0.5
    max_linear_velocity: 0.2
    max_angular_velocity: 0.5
    allow_stationary_steering: false

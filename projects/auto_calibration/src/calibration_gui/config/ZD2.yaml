bev_surround_view:
  node_ns: /bev_surround_view_node #环视算法的ROS节点命名空间
  bev_image_topic: /bev_surround_view_node/bev_image #最终拼接好的360度俯视图像会发布到这个话题
  detection_vis_front_topic: /bev_surround_view_node/detection_vis_front #前方向的目标检测可视化图像的发布主题
  detection_vis_rear_topic: /bev_surround_view_node/detection_vis_rear #后方向的目标检测可视化图像的发布主题
  detection_vis_left_topic: /bev_surround_view_node/detection_vis_left #左方向的目标检测可视化图像的发布主题
  detection_vis_right_topic: /bev_surround_view_node/detection_vis_right #右方向的目标检测可视化图像的发布主题
  output_width: 1280 #鸟瞰图的像素尺寸，宽度为1280像素
  output_height: 1920 #鸟瞰图的像素尺寸，宽度为1280像素
  resolution: 0.01 #图像的物理分辨率0.01，代表图像中一个像素等于实际的0.01米（即1厘米）
  range_front: 420 #前向范围：420像素（约合4.2米）
  range_rear: 860 #后向范围：860像素（约合8.6米）
  range_left: 525 #左向范围：525像素（约合5.25米）
  range_right: 760 #右向范围：760像素（约合7.6米）
  origin_offset_x: 0
  origin_offset_y: 0 #车辆坐标系原点在BEV图像中的中心偏移量。此处为0.0意味着车辆图像会严格按照上述range设定的比例放置在画布中，没有额外平移

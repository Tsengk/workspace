lidars:
  - name: front_middle_lidar
    packets_topic: /tpfront_middle_lidar_packets
    topic: /driver/lidar/cloud//front_middle/offline
    launch_file: sensor_driver/hw_l106_offline/launch/offline_front.launch
    t:
      - 3.7
      - 0
      - 1.0
    R:
      - 0
      - 0
      - 0
  - name: front_left_lidar
    packets_topic: /tpfront_left_lidar_packets
    topic: /driver/lidar/cloud//front_left/offline
    launch_file: sensor_driver/hw_l106_offline/launch/offline_left.launch
    t:
      - 2.8
      - 0.9
      - 1.0
    R:
      - 0
      - 0
      - 60

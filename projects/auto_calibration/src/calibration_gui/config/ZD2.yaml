lidars:
  - name: front_middle_lidar
    packets_topic: /lidarpackets_front
    topic: /driver/lidar/cloud//front_middle/offline
    launch_file: sensor_driver/hw_l106_offline/launch/offline_front.launch
    t:
      - 2.5
      - 0
      - 1.25
    R:
      - 0
      - 0
      - 0
